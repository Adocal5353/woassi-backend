
x-app: &app
  build: .
  image: woassi-api:dev
  restart: unless-stopped
  env_file:
    - .env
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://woassi:woassi@postgres:5432/woassi
    REDIS_URL: redis://redis:6379/0
    MINIO_ENDPOINT: minio:9000
  volumes:
    - ./src:/app/src:ro
    - ./templates:/app/templates:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  api:
    <<: *app
    command: uvicorn woassi.main:create_app --factory --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8001:8000"

  worker:
    <<: *app
    command: arq woassi.worker.WorkerSettings

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: woassi
      POSTGRES_PASSWORD: woassi
      POSTGRES_DB: woassi
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woassi -d woassi"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    user: "0:0"
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf 'GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && read -r status <&3
          && [[ "$$status" == *" 200 "* ]]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    restart: "no"
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export MC_HOST_local="http://$${MINIO_ACCESS_KEY}:$${MINIO_SECRET_KEY}@minio:9000"
        mc mb --ignore-existing "local/$${MINIO_BUCKET_UPLOADS}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET_PRODUCTS}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET_DOCUMENTS}"
        mc anonymous set download "local/$${MINIO_BUCKET_PRODUCTS}"

volumes:
  postgres-data:
  redis_data:
  minio-data:
